# XcodeGen spec for the iOS app.
#
# The .xcodeproj is generated and not committed, since a project file is unreadable in a diff and
# conflicts on every parallel change. `make project` regenerates it and CI does the same before
# building, so this file is the only thing to review.
#
# The project is called SpektrafilmApp because Xcode names its Intermediates.noindex directories
# after the project and the Swift package, and the engine package is SpektraFilm. Two names
# differing by one letter's case merge into a single directory on a case-insensitive filesystem,
# where the targets overwrite each other's output file maps and the build fails with "unable to open
# dependencies file". macOS is case-insensitive by default, CI runners included, so the build fails
# everywhere except on a case-sensitive volume. Users see CFBundleDisplayName.
name: SpektrafilmApp
options:
  bundleIdPrefix: dev.ryanhu.spektrafilm
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SpektraFilm:
    # The engine package at the repository root. A local path, since the engine and the app are
    # shipped and reviewed together.
    path: ..

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: true

targets:
  SpektrafilmApp:
    type: application
    platform: iOS
    sources:
      - path: Spektrafilm
    dependencies:
      - package: SpektraFilm
        product: SpektraFilm
      - sdk: ImageIO.framework
      - sdk: Photos.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ryanhu.spektrafilm
        # Same case-collision reason as the project name above: Xcode also names a target's
        # Intermediates.noindex directory after PRODUCT_NAME. CFBundleDisplayName and CFBundleName
        # below are what the home screen shows.
        PRODUCT_NAME: SpektrafilmApp
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Spektrafilm
        CFBundleName: Spektrafilm
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription:
          Spektrafilm reads the photo you choose so it can run the film simulation on it.
        NSPhotoLibraryAddUsageDescription:
          Spektrafilm saves your finished render back to your photo library.

schemes:
  Spektrafilm:
    build:
      targets:
        SpektrafilmApp: all
    run:
      config: Debug
    archive:
      config: Release
