# XcodeGen spec for the iOS app.
#
# The .xcodeproj is generated, not committed: an Xcode project file is unreviewable in a diff and
# conflicts on every parallel change. `make project` regenerates it, and CI does the same before
# building, so this file is the only thing to review.
# Project name is SpektrafilmApp, not Spektrafilm. Xcode derives Intermediates.noindex directory
# names from the project and the Swift package, and the engine package is SpektraFilm; two names
# differing only by the case of one letter merge into a single directory on a case-insensitive
# filesystem, where the targets overwrite each other's output file maps and the build fails with
# "unable to open dependencies file". macOS is case-insensitive by default, CI runners included, so
# this only reproduces off a case-sensitive volume. Users see CFBundleDisplayName, not this.
name: SpektrafilmApp
options:
  bundleIdPrefix: dev.ryanhu.spektrafilm
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SpektraFilm:
    # The engine package at the repository root. A local path rather than a version pin: the
    # engine and the app ship together and are reviewed together.
    path: ..

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: true

targets:
  SpektrafilmApp:
    type: application
    platform: iOS
    sources:
      - path: Spektrafilm
    dependencies:
      - package: SpektraFilm
        product: SpektraFilm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ryanhu.spektrafilm
        # SpektrafilmApp, not Spektrafilm. Xcode names a target's Intermediates.noindex directory
        # after PRODUCT_NAME, and the engine module is SpektraFilm, so a product called Spektrafilm
        # collides with it on a case-insensitive filesystem: the two targets share one directory,
        # overwrite each other's output file maps, and the build dies with "unable to open
        # dependencies file". macOS is case-insensitive by default, CI runners included, which is
        # why this passed on a case-sensitive local volume and failed in CI. Users never see this
        # name; CFBundleDisplayName and CFBundleName below are what the home screen shows.
        PRODUCT_NAME: SpektrafilmApp
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Spektrafilm
        CFBundleName: Spektrafilm
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Required because the app reads photos the user picks for simulation.
        NSPhotoLibraryUsageDescription:
          Spektrafilm reads the photo you choose so it can run the film simulation on it.
        NSPhotoLibraryAddUsageDescription:
          Spektrafilm saves your finished render back to your photo library.

schemes:
  Spektrafilm:
    build:
      targets:
        SpektrafilmApp: all
    run:
      config: Debug
    archive:
      config: Release
