name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  engine:
    name: Engine (build + parity)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test --parallel

  format:
    name: swift-format
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint
        run: |
          swift format lint --strict --recursive \
            Sources Tests App/Spektrafilm Tools Package.swift

  app:
    name: iOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: make project
      # -quiet keeps warnings and errors in full. Piping through tail would drop the middle of the
      # log, which is where a compile diagnostic appears.
      #
      # Signing stays on. A simulator build signs ad hoc and needs no identity or profile, and with
      # signing on, CI catches a resource bundle that codesign rejects.
      - name: Build for simulator
        run: |
          xcodebuild build -quiet \
            -project App/SpektrafilmApp.xcodeproj \
            -scheme Spektrafilm \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/xcode

  docs:
    name: Docs consistency
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check
        run: Tools/check_docs.py
