name: Parity oracle

# Rebuilds the pinned Python oracle and checks that the committed tables and goldens still match
# what it produces. This runs outside CI because installing NumPy, SciPy, Numba and colour-science
# takes minutes. It fails for only two reasons, neither caused by a normal commit:
#
#   1. Someone hand-edited a generated file or a golden instead of regenerating it.
#   2. A dependency resolved to a version whose numbers differ. This job catches that drift before
#      it changes a render.
#
# Upstream moving does not fail this job. The oracle is pinned to a commit.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  drift:
    name: Generated tables and goldens are reproducible
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Build the pinned oracle
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          make oracle

      - name: Generated tables are reproducible
        run: Tools/parity/oracle/.venv/bin/python Tools/parity/extract_colour_tables.py --check

      - name: Goldens are reproducible
        run: |
          make goldens
          if ! git diff --quiet -- Tests/SpektraFilmTests/Goldens; then
            echo "::error::Regenerating the goldens changed them. Review the render delta:"
            git diff --stat -- Tests/SpektraFilmTests/Goldens
            exit 1
          fi
          echo "goldens match the oracle"

      - name: Tests still pass against the regenerated fixtures
        run: swift test --parallel
